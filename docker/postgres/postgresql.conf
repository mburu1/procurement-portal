# DB Version: 15
# OS Type: linux
# DB Type: web application
# Total Memory (RAM): 4 GB
# CPUs num: 2
# Connections num: 100
# Data Storage: SSD

# CONNECTIONS
max_connections = 100
superuser_reserved_connections = 3

# MEMORY SETTINGS
shared_buffers = 1GB                  # 25% of RAM
work_mem = 16MB                       # Helps with complex queries
maintenance_work_mem = 256MB          # Helps with maintenance tasks
effective_cache_size = 3GB            # 75% of RAM
effective_io_concurrency = 200        # Concurrent IO operations (SSD optimized)

# WRITE AHEAD LOG
wal_buffers = 16MB                    # WAL writer buffer size
wal_writer_delay = 200ms             # How often WAL is written
wal_level = replica                   # Needed for replication
synchronous_commit = off              # Improves performance, small risk of data loss

# QUERY PLANNER
random_page_cost = 1.1               # SSD optimization
effective_cache_size = 3GB           # What the planner assumes about cache

# BACKGROUND WRITER
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# ASYNCHRONOUS BEHAVIOR
max_worker_processes = 2             # Number of CPUs
max_parallel_workers_per_gather = 1  # Parallel query workers
max_parallel_workers = 2             # Max parallel workers total

# LOGGING
log_min_duration_statement = 1000    # Log queries that take more than 1 second
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 250ms
log_error_verbosity = default

# AUTOVACUUM
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.1

# REPLICATION
max_wal_senders = 5
max_replication_slots = 5

# CLIENT CONNECTION DEFAULTS
idle_in_transaction_session_timeout = 600000  # 10 minutes timeout for idle transactions
statement_timeout = 600000                    # 10 minutes timeout for statements
lock_timeout = 60000                         # 1 minute timeout for locks

# DISK
full_page_writes = on                        # Protect against partial page writes
checkpoint_completion_target = 0.9           # Spread out checkpoint writes
checkpoint_timeout = 15min                   # Checkpoint frequency

# QUERY TUNING
default_statistics_target = 100              # Statistics for query planning
constraint_exclusion = partition             # Allow partition pruning
from_collapse_limit = 8                      # Subquery optimization
join_collapse_limit = 8                      # JOIN optimization

# SECURITY
password_encryption = scram-sha-256          # Strong password hashing
ssl = on                                     # Enable SSL connections